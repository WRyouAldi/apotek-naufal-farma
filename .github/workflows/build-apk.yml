name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Rebuild exact Harga Beli payload
        run: cat tools/harga_beli_parts/[0-9][0-9] > tools/harga_beli.b64
      - name: Prepare APK HTML
        run: python3 tools/prepare_apk_v3.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apotek-Naufal-Farma-V17-APK
          path: app/build/outputs/apk/debug/app-debug.apk
