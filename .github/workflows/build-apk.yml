name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Rebuild exact Harga Beli payload
        run: cat tools/harga_beli_parts/[0-9][0-9] > tools/harga_beli.b64
      - name: Prepare APK HTML
        run: python3 tools/prepare_apk_v3.py
      - name: Validate generated database seed
        run: |
          python3 - <<'PY'
          import json
          p='app/src/main/assets/products_seed.json'
          rows=json.load(open(p,encoding='utf-8'))
          costs=sum(1 for x in rows if int(x.get('cost',0) or 0)>0)
          assert len(rows)==4348, f'Expected 4348 products, got {len(rows)}'
          assert costs>=4000, f'Expected Harga Beli for >=4000 products, got {costs}'
          print(f'Database seed OK: {len(rows)} products; Harga Beli: {costs}')
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Apotek-Naufal-Farma-V17-Build-${{ github.run_number }}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apotek-Naufal-Farma-V17-Build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/Apotek-Naufal-Farma-V17-Build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
